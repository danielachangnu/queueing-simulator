[package]
name = "queuing-sim"
version = "0.1.0"
authors = ["Daniela Chang <danielachangkim2028@u.northwestern.edu>", "Izzy Grosof <izzy.grosof@northwestern.edu>"]
edition = "2024"
license = "MIT"
keywords = ["queueing", "simulation", "scheduling"]
description = "A discrete-event simulator for single-server queueing policies (FCFS, SRPT, LAS, PS, and more)."
